name: Club directory import

on:
  schedule:
    # Every 3 hours (UTC), offset from the content worker
    - cron: '47 */3 * * *'
  workflow_dispatch:

concurrency:
  group: club-import
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Import clubs from OpenStreetMap
        run: node src/index.js --only=clubs
        env:
          SUPABASE_URL: https://ewfuhrlgdivwtdremkdv.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_CLUB_REGIONS_PER_RUN: ${{ vars.MAX_CLUB_REGIONS_PER_RUN || '8' }}
          MAX_RUN_MINUTES: '50'
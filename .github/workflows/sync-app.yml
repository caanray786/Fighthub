# Publishes the Fight Hub training app at /app on this website.
# The app's source lives in github.com/RyanC786/Fight-Hub-App (folder app/).
# This copies it here every hour (or on demand) and commits only when it changed;
# Vercel then deploys the website as usual.
name: Sync training app

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-app
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Copy app/ from Fight-Hub-App
        run: |
          git clone --depth 1 https://github.com/RyanC786/Fight-Hub-App.git /tmp/fight-hub-app
          # Tests stay in the app repository; everything else is published
          rsync -a --delete --exclude '*.test.cjs' /tmp/fight-hub-app/app/ app/

      - name: Commit if the app changed
        run: |
          if [ -z "$(git status --porcelain app)" ]; then
            echo "App unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Sync training app from Fight-Hub-App@$(git -C /tmp/fight-hub-app rev-parse --short HEAD)"
          git push

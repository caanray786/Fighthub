<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../images/favicon-48.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <title>FightHub Admin — Login</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">

  <div class="admin-login">
    <div class="admin-login-card">
      <div class="login-brand"><img src="../images/logo-256.png" alt="FightHub" width="150" height="150" style="display: block; margin: 0 auto;"></div>
      <div class="login-subtitle">ADMIN CONTROL PANEL</div>
      
      <div id="login-error-msg" class="login-error"></div>
      
      <form id="admin-login-form" class="login-form">
        <div class="form-group" id="email-group" style="display: none;">
          <label for="admin-email">Email</label>
          <input type="email" id="admin-email" placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-admin-primary" style="justify-content: center; width: 100%; margin-top: 10px;">
          Log In ⚡
        </button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/data-defaults.js"></script>
  <script src="../js/datastore.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await dataStore.ready;
      
      const form = document.getElementById('admin-login-form');
      const emailInput = document.getElementById('admin-email');
      const passwordInput = document.getElementById('admin-password');
      const errorMsg = document.getElementById('login-error-msg');
      const submitBtn = form.querySelector('button[type="submit"]');

      // Cloud mode signs in with a Supabase account; local mode uses the dev password
      if (dataStore.cloud) {
        document.getElementById('email-group').style.display = '';
        emailInput.required = true;
        emailInput.focus();
      } else {
        passwordInput.focus();
      }

      // If already logged in, redirect to index
      if (await dataStore.isAdminSignedIn()) {
        window.location.href = 'index.html';
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        errorMsg.classList.remove('show');

        try {
          await dataStore.signInAdmin(emailInput.value.trim(), passwordInput.value);
          window.location.href = 'index.html';
        } catch (err) {
          errorMsg.textContent = err.message;
          errorMsg.classList.add('show');
          passwordInput.value = '';
          passwordInput.focus();
        } finally {
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
